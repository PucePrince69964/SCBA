<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo3.css">
</head>
<body>
    <header>
        <h1>SCBA</h1>
        <div class="links">
            <a href="menu.html" class="btn1">Página inicial</a>
            <a href="#" class="btn2">Entrar</a>
        </div>
    </header>
    <div id="container1" style="display:none;">
        <input type="file" id="fileUpload" name="fileUpload" accept=".xlsx">
        <p class="msg" id="msg"></p>
        <button type="button" id="x">x</button>
        <button type="button" class="validar">Validar</button>
    </div>
    <div id="container" class="container">
        <h2>Registre-se no SCBA</h2>
        <form action="#" method="post">
            <label for="username">Nome de usuário:</label>
            <input type="text" id="username" name="username" required>

            <label for="ra">RA:</label>
            <input type="text" id="ra" name="ra" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" id="btn3" class="btn3">Registrar</button>
            <button type="button" id="scba" class="btn4">Implementar o SCBA</button>
        </form>
    </div>
    <p class="login">Já tem uma conta? <a href="login.html">Faça login</a></p>
    <footer>
        <p>&copy; 2026 Sistema de Cadastro de Benefícios Automatizado (SCBA). Todos os direitos reservados.</p>
    </footer>
    <script src="interacao.js"></script>
</body>
</html>
